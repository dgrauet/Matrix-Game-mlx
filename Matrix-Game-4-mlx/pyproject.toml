[project]
name = "matrix-game-4-mlx"
version = "0.1.0"
description = "MLX inference port of Matrix-Game 4.0 (offline rendering)"
requires-python = ">=3.11"
dependencies = ["mlx>=0.31.0", "numpy", "Pillow", "imageio-ffmpeg", "huggingface_hub",
                "safetensors", "tokenizers", "transformers", "ftfy", "regex"]

[project.scripts]
matrix-game-mlx = "matrix_game_mlx.cli:main"

[project.optional-dependencies]
parity = ["torch", "diffusers", "einops"]
serve = ["aiohttp>=3.10,<4"]

[tool.setuptools.packages.find]
include = ["matrix_game_mlx*"]

[tool.setuptools.package-data]
matrix_game_mlx = ["configs/*.json"]

[tool.pytest.ini_options]
markers = ["needs_weights: requires the converted MLX pack", "needs_fixtures: requires torch reference fixtures",
           "needs_racing_game: requires the built upstream racing game and its assets"]
